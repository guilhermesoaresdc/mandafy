name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, lint, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          BUILD_STANDALONE: '1'
          NEXT_TELEMETRY_DISABLED: '1'

  migrations:
    name: Migrations aplicam num Postgres limpo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mandafy
          POSTGRES_PASSWORD: mandafy
          POSTGRES_DB: mandafy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mandafy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Redis, porque metade das suítes de banco ENFILEIRA de verdade.
      #
      # `disparo-lote.test.ts` chama `enfileirarLote`, que fala com o BullMQ —
      # não é mock, é o caminho real, e é isso que faz o teste valer. Sem um
      # Redis de pé, o ioredis não falha: ele RECONECTA, com backoff, em
      # silêncio. O teste não quebra com "conexão recusada" — ele fica parado
      # até o vitest desistir aos 5 segundos, e depois cada hook seguinte
      # estoura em cascata. Um erro que se disfarça de lentidão.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vale mais que qualquer teste unitário do schema: prova que o SQL
      # escrito à mão aplica de ponta a ponta, com partições e RLS.
      # O papel da aplicação precisa existir ANTES das migrations: os GRANT de
      # 0010_rls.sql são condicionais (`IF EXISTS mandafy_app`), então sem ele
      # elas aplicam em silêncio e o RLS fica sem ninguém a quem se aplicar.
      - name: Criar o papel da aplicação
        env:
          PGPASSWORD: mandafy
        run: |
          psql -h localhost -U mandafy -d mandafy -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname = 'mandafy_app'" | grep -q 1 \
            || psql -h localhost -U mandafy -d mandafy -v ON_ERROR_STOP=1 -c \
              "CREATE ROLE mandafy_app LOGIN PASSWORD 'mandafy_app'"

      - name: Aplicar migrations
        run: npm run db:migrate
        env:
          DATABASE_URL_ADMIN: postgresql://mandafy:mandafy@localhost:5432/mandafy

      - name: Aplicar de novo — precisa ser idempotente
        run: npm run db:migrate
        env:
          DATABASE_URL_ADMIN: postgresql://mandafy:mandafy@localhost:5432/mandafy

      - name: Popular dados iniciais
        run: npm run db:seed
        env:
          DATABASE_URL_ADMIN: postgresql://mandafy:mandafy@localhost:5432/mandafy
          SEED_ADMIN_EMAIL: admin@mandafy.local
          SEED_ADMIN_PASSWORD: senha-de-teste-ci

      - name: Seed roda duas vezes sem duplicar
        run: npm run db:seed
        env:
          DATABASE_URL_ADMIN: postgresql://mandafy:mandafy@localhost:5432/mandafy
          SEED_ADMIN_EMAIL: admin@mandafy.local
          SEED_ADMIN_PASSWORD: senha-de-teste-ci

      # AS SUÍTES QUE TOCAM BANCO — e que nunca rodaram no CI.
      #
      # Elas se pulam sozinhas sem `TEST_DATABASE_URL*` (`describe.skipIf`), e o
      # `npm test` do primeiro job não tem banco nenhum: são 16 arquivos
      # ignorados, entre eles cancelamento por chave (§5.1, "a lógica mais
      # crítica do sistema" pelo próprio CLAUDE.md), o RLS por consultor e o
      # disjuntor de canal. Passavam por verdes por não terem sido executadas.
      - name: Testes que precisam de banco
        run: npm test
        env:
          TEST_DATABASE_URL_ADMIN: postgresql://mandafy:mandafy@localhost:5432/mandafy
          TEST_DATABASE_URL: postgresql://mandafy_app:mandafy_app@localhost:5432/mandafy
          REDIS_URL: redis://localhost:6379
